<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Room</title>
    <link rel="stylesheet" href="/css/dungeon-wall.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">DUNGEON ARENA</div>

        <nav>
            <form action="/logout" method="POST" class="logout-form">
                <button type="submit" class="logout-link">LOGOUT</button>
            </form>
        </nav>
    </header>


    <!-- Create Room Page -->
    <main class="rooms-page">

        <!-- Page Header -->
        <div class="create-room-header">
            <h1>CREATE ROOM</h1>
        </div>


        <!-- Create Room Form -->
        <section class="active-rooms-section">

            <form id="create-room-form" action="/your-room" method="POST" class="create-room-form auth-form">

                <label for="roomName">Enter Room Name:</label>

                <input
                    type="text"
                    id="roomName"
                    name="roomName"
                    placeholder="Enter room name..."
                    required
                >

                <div class="password-requirements">
                    <p id="roomNameLength" class="requirement">
                        * At least 1 character and at most 20 characters
                    </p>
                </div>

                <button type="submit" class="create-room-button">
                    CREATE ROOM
                </button>

            </form>

        </section>

    </main>

    <!-- Custom Alert Popup -->
    <div id="alert-modal" class="alert-modal">
        <div class="alert-box">
            <h2 id="alert-title">REGISTRATION ERROR</h2>

            <p id="alert-message">Please check your registration details.</p>

            <button id="alert-close" class="enter-button">
                OK
            </button>
        </div>
    </div>

    <!-- Load JavaScript after HTML elements exist -->
    <script src="/js/auth.js"></script>
    <script src="/js/buttonControl.js"></script>

</body>
</html>
