
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Dungeon Arena</title>

    <link rel="stylesheet" href="/css/dungeon-wall.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <a href="/" class="logo">DUNGEON ARENA</a>

        <nav>
            <a href="/">HOME</a>
            <a href="/login">LOGIN</a>
        </nav>
    </header>

    <!-- Registration Section -->
    <main class="login-page">

        <section class="login-container">

            <p class="subtitle">BEGIN YOUR ADVENTURE</p>

            <h1>JOIN THE ARENA</h1>

            <p class="login-description">
                Create an account to enter the dungeon.
            </p>

            <form action="/register" method="POST">

                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        required
                    >
                </div>

                <button type="submit" class="enter-button">
                    CREATE ACCOUNT
                </button>

            </form>

            <p class="register-link">
                Already have an account?
                <a href="/login">Login here</a>
            </p>

            <a href="/" class="back-link">← BACK TO HOME</a>

        </section>

    </main>

</body>
</html>
