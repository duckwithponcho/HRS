
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE 312 - Dungeon Arena</title>

    <link rel="stylesheet" href="/css/dungeon-wall.css">
</head>
<body>

    <header class="navbar">
    <a href="/" class="logo">DUNGEON ARENA</a>

    <nav>
       {% if username %}
    <span class="nav-username">Welcome, {{ username }}!</span>

    <form action="/logout" method="POST" class="logout-form">
        <button type="submit" class="logout-link">LOGOUT</button>
    </form>
{% else %}
    <a href="/login">LOGIN</a>
{% endif %}
    </nav>
</header>

    <main class="hero">

        <h1>THE DUNGEON<br>AWAITS</h1>

        <p class="description">
            Enter the arena. Face your enemies.
            Fight your way to victory.
        </p>

        <a href="/login" class="enter-button">
            ENTER THE DUNGEON
        </a>


    </main>

</body>
</html>
