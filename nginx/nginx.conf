events {
    worker_connections 1024;
}
http {
    resolver 127.0.0.11 valid=10s; #tells Nginx which DNs server to use when resolving hostnames 
    map "$request_method:$uri" $backend { #look at the HTTP method and the rquested URL
        default                 http://game-server:8080; #if none of the thoer ules match, nginx sends hte requet to game-server

        POST:/login             http://auth-server:8001;
        POST:/register          http://auth-server:8001;
        POST:/logout            http://auth-server:8001;
    }

    server {
        listen 80; #listen for incoming requests on 80 

        location / { #matches requests to the root path and its subpaths
            proxy_pass $backend; #fowards the incoming request which ever URL was chosen and hte nnstored in the $backend variable
        }
    }
}
