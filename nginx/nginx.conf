events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    map "$request_method:$uri" $backend {
        default                 http://game-server:8080;

        POST:/login             http://auth-server:8001;
        POST:/register          http://auth-server:8001;
        POST:/logout            http://auth-server:8001;
    }

    server {
        listen 80;

        location / {
            proxy_pass $backend;
        }
    }
}
