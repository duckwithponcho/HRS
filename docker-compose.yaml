services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${LOCAL_USER}
      POSTGRES_PASSWORD: ${LOCAL_PASSWORD}
      POSTGRES_DB: ${LOCAL_DB}
    healthcheck:
      test: ["CMD", "pg_isready",  "-U", "${LOCAL_USER}", "-d","${LOCAL_DB}"]
      interval: 1s
      timeout: 5s
      retries: 20
      start_period: 0s


  game-server:
    build:
      context: ./game-server
      dockerfile: Dockerfile
    container_name: shooter-game-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${LOCAL_USER}
      POSTGRES_PASSWORD: ${LOCAL_PASSWORD}
      POSTGRES_DB: ${LOCAL_DB}
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/pages:/app/pages:ro
      - ./frontend/css:/app/css:ro
      - ./frontend/js:/app/js:ro
      - ./frontend/images:/app/images:ro
